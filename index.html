<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check This Out</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%23111214%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%227.5%22 fill=%22none%22 stroke=%22white%22 stroke-width=%221.6%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%223%22 fill=%22%232b4bff%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* VOICE everyday personal tool, quiet and exact
   IDEA a record shop's catalogue index: one ledger for records, films, shows and sets
   PICTURE the list itself, in three readings: Index (ledger), Wall (cover wall), Notes (liner notes)
   COLOUR white or near-black ground, ink, one cobalt accent; flat cover colours for items without art
   TYPE Inter Tight for the ledger and wall, Newsreader for the liner notes
   LAYOUT slim header with the add box and view switch, filters on one line, content full width */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1013);--ink:light-dark(#111214,#ececee);--mut:light-dark(#686b73,#9a9ca3);--rule:light-dark(#e7e8eb,#25272c);--soft:light-dark(#f5f5f6,#17181c);--acc:light-dark(#2b4bff,#8396ff);--scrim:rgba(10,11,14,.78)}
:root[data-theme=light]{color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .card .cv{box-shadow:0 18px 40px rgba(0,0,0,.5)}}
:root[data-theme=dark] .card .cv{box-shadow:0 18px 40px rgba(0,0,0,.5)}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Inter Tight",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{padding-inline:max(4vw,16px)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:20px;height:64px}
.mark{font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.add{position:relative;flex:1;max-width:560px}
.add input{width:100%;height:40px;border:1px solid var(--rule);border-radius:6px;background:var(--soft);padding:0 12px 0 36px;font-size:16px}
.add input:focus{background:var(--bg);border-color:var(--acc);outline:0}
.add svg{position:absolute;left:12px;top:12px;width:16px;height:16px;stroke:var(--mut)}
.res{position:absolute;left:0;right:0;top:46px;background:var(--bg);border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-height:min(72vh,600px);overflow:auto;display:none}
.res.on{display:block}
.res hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.res h6{margin:0;padding:10px 12px 4px;font-size:12px;font-weight:500;color:var(--mut)}
.res button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 12px;min-height:44px}
.res button:hover,.res button.hi{background:var(--soft)}
.res small{color:var(--mut)}
.res .note{padding:8px 12px 12px;color:var(--mut);font-size:13px}
.views{display:flex;gap:18px;margin-left:auto}
.views button{height:64px;color:var(--mut);font-weight:500;border-bottom:2px solid transparent}
.views button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;color:var(--mut);font-weight:500;height:64px;display:flex;align-items:center}
.menu summary::-webkit-details-marker{display:none}
.menu div{position:absolute;z-index:25;right:0;top:56px;background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:6px;width:180px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.menu div button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:4px}
.menu div button:hover{background:var(--soft)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding-block:14px}
.filters button{color:var(--mut);padding:4px 0}
.filters button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
.filters i{font-style:normal;font-variant-numeric:tabular-nums;margin-left:4px;opacity:.7}
.filters .sep{width:1px;height:16px;background:var(--rule)}
.filters select{margin-left:auto;border:0;background:none;color:var(--mut);padding:4px 0}
.sum{color:var(--mut);font-size:13px;padding-bottom:12px}
.sum b{color:var(--ink);font-weight:500}
.sum button{color:var(--acc);margin-left:8px}
main{padding-bottom:80px}
/* status mark */
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.st.prog::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.st.done{color:var(--mut)}.st.done::before{background:currentColor}
.st.again{color:var(--acc)}.st.again::before{background:currentColor;border-color:currentColor}
/* covers */
.cv{position:relative;overflow:hidden;background:var(--c,#333);color:#fff}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv .ct{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}
.cv .ct b{font-size:clamp(14px,1.5vw,19px);line-height:1.1;letter-spacing:-.015em;font-weight:600}
.cv .ct span{font-size:12.5px;opacity:.8;margin-top:3px}
.cv .ct em{position:absolute;top:10px;left:12px;font-style:normal;font-size:12px;opacity:.75}
.cv.mini{width:40px;height:40px;border-radius:3px;flex:none}
.cv.mini .ct,.cv.ini .ct{padding:0;align-items:center;justify-content:center}
.cv.mini .ct b{font-size:16px}
.cv.ini .ct b{font-size:34px;font-weight:500}
.cv{font-family:"Inter Tight",sans-serif}
.cv.round{border-radius:50%}
/* index */
table.ix{width:100%;border-collapse:collapse}
.ix th{font-weight:500;font-size:12.5px;color:var(--mut);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--ink)}
.ix td{padding:9px 12px 9px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.ix tr.row{cursor:pointer}
.ix tr.row:hover td{background:var(--soft)}
.ix .t{display:flex;align-items:center;gap:12px}
.ix .t b{font-weight:500;display:block;line-height:1.25}
.ix .t span{color:var(--mut);font-size:13.5px}
.ix .m{color:var(--mut);white-space:nowrap}
.ix .n{font-variant-numeric:tabular-nums;color:var(--mut);text-align:right;padding-right:0;white-space:nowrap}
.stars{letter-spacing:1px;color:var(--ink);font-size:12px}
@media(max-width:720px){.ix .hm{display:none}}
/* wall */
.wall{display:grid;gap:2px;grid-auto-flow:dense}
.wall .cv{cursor:pointer;transition:opacity .25s}
.wall .s{grid-column:span 2;grid-row:span 2}
.wall .p{grid-column:span 2;grid-row:span 3}
.wall .w{grid-column:span 4;grid-row:span 2}
.wall .dim{opacity:.12}
.wall .hv{position:absolute;inset:auto 0 0 0;background:var(--scrim);padding:10px 12px;opacity:0;transition:opacity .15s;font-size:13px}
.wall .hv b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.wall .cv:hover .hv,.wall .cv:focus-visible .hv{opacity:1}
.wall .hasimg .ct{display:none}
/* notes */
.notes{max-width:760px;margin:0 auto;font-family:Newsreader,Georgia,serif}
.ent{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:28px;padding:40px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.ent:first-child{padding-top:16px}
.ent .k{font:13px/1.4 "Inter Tight",sans-serif;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap}
.ent h2{font-weight:500;font-size:clamp(30px,4.4vw,46px);line-height:1.05;letter-spacing:-.02em;margin:10px 0 6px;text-wrap:balance}
.ent .by{font-size:19px;color:var(--mut);margin:0}
.ent blockquote{margin:22px 0 0;font-size:21px;line-height:1.45;font-style:italic;max-width:60ch}
.ent cite{display:block;font:13.5px/1.4 "Inter Tight",sans-serif;font-style:normal;color:var(--mut);margin-top:8px}
.ent .cv{width:120px;height:120px;border-radius:2px}
.ent .cv.pp{height:180px}
.ent:hover h2{color:var(--acc)}
@media(max-width:600px){.ent{grid-template-columns:minmax(0,1fr) 72px;gap:16px}.ent .cv{width:72px;height:72px}.ent .cv.pp{height:108px}.ent blockquote{font-size:18px}}
.empty{padding:80px 0;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:20px;font-weight:600;margin-bottom:6px}
/* drawer */
.dr{position:fixed;inset:0 0 0 auto;width:min(500px,100%);background:var(--bg);border-left:1px solid var(--rule);z-index:40;transform:translateX(100%);transition:transform .22s ease;overflow:auto;overscroll-behavior:contain}
.dr.on{transform:none;box-shadow:-12px 0 40px rgba(0,0,0,.1)}
.ip{position:relative;padding:28px 28px 40px;display:grid;gap:22px}
.ip .x{position:absolute;top:14px;right:14px;width:40px;height:40px;font-size:24px;color:var(--mut);border-radius:50%;z-index:2}
.ip .x:hover{background:var(--soft);color:var(--ink)}
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:end;padding-right:36px}
.ip.w .hero{grid-template-columns:minmax(0,1fr);padding-right:0}
.cv.big{width:150px;height:150px;border-radius:3px}
.cv.big.pp{height:225px}
.cv.big.ww{width:100%;height:auto;aspect-ratio:16/9;margin-top:28px}
.cv.big .ct b{font-size:52px;font-weight:500}
.ip.w .cv.big:not(.hasimg) .ct b{font-size:64px}
.hero .mt{font-size:13px;color:var(--mut)}
.hero h2{font-size:clamp(26px,4vw,34px);line-height:1.05;letter-spacing:-.025em;font-weight:600;margin:6px 0 6px;text-wrap:balance}
.hero p{margin:0;font-size:17px;color:var(--mut)}
.lks{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:-6px}
.lk{color:var(--acc);text-decoration:none;font-weight:500}
.lk span{margin-left:4px;font-size:.9em}
.lk:hover{text-decoration:underline;text-underline-offset:4px}
.ip .seg{margin-top:2px}
.rate{display:flex;align-items:center;gap:0;margin-top:-10px}
.rate button{width:34px;height:36px;font-size:21px;color:var(--rule)}
.rate button.on{color:var(--ink)}
.rate:hover button{color:var(--ink)}
.rate button:hover~button{color:var(--rule)}
.rate span{color:var(--mut);font-size:13px;margin-left:6px}
.rv{display:flex;align-items:flex-end;gap:12px;margin-top:-12px}
.rvb{display:flex;align-items:flex-end;gap:4px;height:28px}
.rvb button{width:14px;border-radius:2px;background:var(--rule)}
.rvb button.on{background:var(--acc)}
.rvb:hover button{background:var(--acc)}
.rvb button:hover~button{background:var(--rule)}
.rvt{font-size:13px;color:var(--mut);padding-bottom:1px}
.rvm{display:inline-flex;align-items:flex-end;gap:2px;margin-left:10px;height:13px;vertical-align:-1px}
.rvm i{width:3px;background:var(--rule);border-radius:1px}
.rvm i.on{background:var(--acc)}
.nt{font:italic 21px/1.45 Newsreader,Georgia,serif;border:0;padding:0;resize:none;background:none;color:var(--ink);width:100%;overflow:hidden;min-height:31px}
.nt::placeholder{color:var(--mut)}
.nt:focus{outline:0;box-shadow:0 1px 0 var(--acc)}
.rb{display:flex;align-items:baseline;gap:8px;color:var(--mut);font-size:14px;margin-top:-10px}
.rb input{border:0;background:none;font-size:15px;color:var(--ink);padding:2px 0;flex:1;border-bottom:1px solid transparent}
.rb input:hover{border-bottom-color:var(--rule)}
.rb input:focus{outline:0;border-bottom-color:var(--acc)}
.more summary{cursor:pointer;color:var(--mut);font-size:14px;list-style:none;padding:6px 0}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:" +"}
.more[open] summary::after{content:" −"}
.more form{display:grid;gap:14px;padding-top:12px}
.more label{display:grid;gap:5px;font-size:13px;color:var(--mut)}
.more input,.more select{font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:9px 10px}
.more input:focus,.more select:focus{border-color:var(--acc);outline:0}
.ad{margin:0;color:var(--mut);font-size:13px;border-top:1px solid var(--rule);padding-top:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.seg button{min-height:42px;font-size:13.5px;color:var(--mut);border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
@media(max-width:600px){.ip{padding:20px 18px 32px}.hero{grid-template-columns:110px minmax(0,1fr);gap:16px}.cv.big{width:110px;height:110px}.cv.big.pp{height:165px}.cv.big .ct b{font-size:40px}}
.sp{color:var(--acc);text-decoration:none;font-size:13.5px;white-space:nowrap}
.sp:hover{text-decoration:underline}
.watch{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0}
.wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.wh b{font-weight:600;font-size:14px}
.wr{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;padding:5px 0;font-size:14px}
.wr>span{color:var(--mut);font-size:13px;padding-top:2px}
.wr div{display:flex;flex-wrap:wrap;gap:6px 14px}
.pv{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pv img{border-radius:5px}
.wn{margin:4px 0 0;color:var(--mut);font-size:13px}
.del{color:#c4321f;font-size:14px;justify-self:start;padding:8px 0}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:35;display:none}
.shade.on{display:block}
/* toast, dialog */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:6px;display:flex;gap:16px;opacity:0;pointer-events:none;transition:.2s;z-index:60;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:inherit;font-weight:600;text-decoration:underline}
dialog{border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);width:min(620px,92vw);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.3)}
dialog h3{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
dialog p{margin:0 0 14px;color:var(--mut)}
dialog textarea{width:100%;height:220px;font:12.5px/1.45 ui-monospace,Menlo,monospace;border:1px solid var(--rule);border-radius:5px;padding:10px;background:var(--soft)}
dialog input{width:100%;font-size:16px;border:1px solid var(--rule);border-radius:5px;padding:9px 10px;background:var(--bg)}
.dbtn{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{height:40px;padding:0 16px;border-radius:5px;border:1px solid var(--rule);font-weight:500}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media(max-width:760px){.bar{flex-wrap:wrap;height:auto;padding-top:12px;gap:0 16px}.add{order:3;flex-basis:100%;max-width:none;margin:4px 0 10px}.views button,.menu summary{height:44px}.menu div{top:44px}}
.mark{display:flex;align-items:center;gap:9px}
.mark svg{width:22px;height:22px;flex:none}
.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.2}
.pat.fl *{vector-effect:non-scaling-stroke}
.cv.mini .pat{display:none}
.cv.dz{filter:saturate(calc(1 - var(--dust) * .85)) brightness(calc(1 + var(--dust) * .08))}
.dzr b,.dzr h2,.dzr .t span{opacity:calc(1 - var(--dust) * .4)}
.wall .hv{background:color-mix(in srgb,var(--c) 45%,#0b0c0f)}
/* shelf */
.shelf{padding:24px 0 4px;border-bottom:1px solid var(--rule)}
.sh-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.sh-h h2{font-size:21px;letter-spacing:-.02em;margin:0;font-weight:600}
.sh-r{display:flex;gap:22px;overflow-x:auto;padding-bottom:18px;scrollbar-width:thin}
.sc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;flex:none;width:148px}
.sc.p{width:99px}.sc.w{width:263px}
.sc .cv{width:100%;height:148px;border-radius:3px;margin-bottom:10px}
.sc .why{font-size:12.5px;color:var(--mut)}
.sc .why.a{color:var(--acc)}
.sc b{font-weight:600;line-height:1.2;margin-top:3px}
.sc .cr{font-size:13.5px;color:var(--mut);line-height:1.3}
.sc:hover b{text-decoration:underline;text-underline-offset:3px}
.hint{display:none}
@media(hover:none) and (max-width:760px){.hint{display:block;margin-top:4px}}
/* pick */
.pk{display:grid;gap:8px;margin-bottom:16px}
.seg.s5{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:600px){.seg.s5{grid-template-columns:repeat(3,minmax(0,1fr))}.seg.s5 button:nth-child(n+4){border-top:1px solid var(--rule)}.seg.s5 button:nth-child(4){border-left:0}}
.seg.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pres{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:start;padding:16px;background:color-mix(in srgb,var(--ic) 12%,var(--bg));border-radius:6px;min-height:152px}
.pres .cv{width:120px;height:120px;border-radius:3px}.pres .cv.pp{height:180px}
.pres .mt{font-size:13px;color:var(--mut)}
.pres h4{font-size:26px;line-height:1.08;letter-spacing:-.02em;margin:6px 0 4px}
.pres p{margin:0;color:var(--mut)}
.pres blockquote{margin:12px 0 0;font:italic 18px/1.4 Newsreader,Georgia,serif}
.pres.none{display:block;min-height:0}
.btn:disabled{opacity:.4}
/* item tint */
.ip .hero{margin:-28px -28px 0;padding:28px 64px 24px 28px;background:color-mix(in srgb,var(--ic) 16%,var(--bg))}
.ip.w .hero{padding:28px 28px 24px}
/* quick add */
.qa{position:fixed;left:50%;bottom:24px;transform:translate(-50%,24px);width:min(600px,calc(100% - 32px));background:var(--bg);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 32px rgba(0,0,0,.14);padding:12px 14px;display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:45}
.qa.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.qi b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.qrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qrow .seg{width:190px}.qrow .seg button{min-height:34px}
.qrow input{flex:1;min-width:120px;font-size:16px;border:0;border-bottom:1px solid var(--rule);background:none;padding:6px 0}
.qrow input:focus{outline:0;border-color:var(--acc)}
.qx{width:36px;height:36px;font-size:22px;color:var(--mut)}
/* crate */
.crate{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center;margin:8px calc(-1 * max(4vw,16px)) 0;padding:clamp(28px,5vw,64px) max(4vw,16px);background:color-mix(in srgb,var(--ic) 14%,var(--bg));min-height:min(78vh,720px)}
.stage{position:relative;width:min(56vh,100%,480px);aspect-ratio:1;justify-self:center}
.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.card .cv{box-shadow:0 18px 40px rgba(0,0,0,.18);border-radius:3px}
.cv.crt.s{width:100%;height:100%}.cv.crt.p{height:100%;width:66.6%}.cv.crt.w{width:100%;height:56.25%}
.card.c1{transform:translate(16px,-14px) rotate(3deg) scale(.95);filter:brightness(.88);z-index:1}
.card.c2{transform:translate(30px,-26px) rotate(6deg) scale(.9);filter:brightness(.76)}
.card.c0{z-index:2;cursor:pointer}
.card.in{animation:settle .32s cubic-bezier(.2,.7,.2,1)}

  if(e.key==='Escape'){closeItem();$('#res').classList.remove('on');$('#q').blur()}
  if(typing)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus()}
  if(['1','2','3'].includes(e.key)){st.view=VIEWS[+e.key-1];save();render()}
  if(st.view==='next'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();crateGo(e.key==='ArrowRight'?1:-1)}
  if(e.key==='Enter'&&document.activeElement.dataset.id)openItem(document.activeElement.dataset.id)});
addEventListener('hashchange',()=>{if(!applySetup())route(location.hash.slice(1));render()});

/* swipe rows on touch */
let sw=null,swiped=0;
document.addEventListener('touchstart',e=>{const tr=e.target.closest('.ix tr.row');sw=tr?{tr,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,on:false}:null},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;
  if(!sw.on){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5)sw.on=true;else if(Math.abs(dy)>12){sw=null;return}else return}
  sw.dx=dx;sw.tr.classList.add('swp');sw.tr.dataset.sw=dx>0?'Done':'Revisit';sw.tr.style.setProperty('--swc',dx>0?'var(--ink)':'var(--acc)');
  sw.tr.querySelectorAll('td').forEach(td=>td.style.transform=`translateX(${dx}px)`)},{passive:true});
document.addEventListener('touchend',()=>{if(!sw)return;const{tr,dx,on}=sw;sw=null;if(!on)return;swiped=Date.now();
  tr.querySelectorAll('td').forEach(td=>td.style.transform='');tr.classList.remove('swp');
  if(Math.abs(dx)>90){const it=st.items.find(i=>i.id===tr.dataset.id),ns=dx>0?'done':'again';if(it)upd(()=>{setSt(it,ns)},`Marked ${S[ns].toLowerCase()}`)}});
/* full-screen search on phones */
const phone=()=>matchMedia('(max-width:760px)').matches;
$('#q').addEventListener('focus',()=>{if(phone())$('.add').classList.add('full')});
$('#qc').addEventListener('click',()=>{$('#q').value='';$('#res').classList.remove('on');$('.add').classList.remove('full');$('#q').blur()});
/* quick add card */
let qt;
function quick(it){const q=$('#qa');q.dataset.id=it.id;$('#toast').classList.remove('on');
  q.innerHTML=`${cover(it,'mini'+(it.type==='artist'?' round':''))}<div class="qi"><b>Added ${esc(it.title)}</b><div class="qrow"><div class="seg s2"><button type="button" data-qs="check" aria-pressed="${it.status==='check'}">Check out</button><button type="button" data-qs="again" aria-pressed="${it.status==='again'}">Revisit</button></div><input id="qby" placeholder="Recommended by" value="${esc(it.by)}" aria-label="Recommended by"></div></div><button type="button" class="lk" id="qo">Open</button><button type="button" class="qx" id="qx" aria-label="Dismiss">×</button>`;
  q.classList.add('on');clearTimeout(qt);qt=setTimeout(()=>q.classList.remove('on'),9000)}
$('#qa').addEventListener('click',e=>{const it=st.items.find(i=>i.id===$('#qa').dataset.id);if(!it)return;const b=e.target.closest('button');if(!b)return;
  if(b.dataset.qs){setSt(it,b.dataset.qs);save();render();$('#qa').querySelectorAll('[data-qs]').forEach(x=>x.setAttribute('aria-pressed',x===b))}
  if(b.id==='qo'){$('#qa').classList.remove('on');openItem(it.id)}if(b.id==='qx')$('#qa').classList.remove('on')});
$('#qa').addEventListener('input',e=>{const it=st.items.find(i=>i.id===$('#qa').dataset.id);if(it&&e.target.id==='qby'){it.by=e.target.value;save();render()}});
$('#qa').addEventListener('focusin',()=>clearTimeout(qt));
$('#qa').addEventListener('focusout',()=>{clearTimeout(qt);qt=setTimeout(()=>$('#qa').classList.remove('on'),6000)});
/* swipe crate stage */
let cx0=null;
document.addEventListener('touchstart',e=>{cx0=e.target.closest('#stage')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(cx0==null)return;const dx=e.changedTouches[0].clientX-cx0;cx0=null;if(Math.abs(dx)>50){swiped=Date.now();crateGo(dx<0?1:-1)}});
/* adding */
const isUrl=s=>/^https?:\/\/\S+$/i.test(s.trim());
function fromUrl(u){const h=new URL(u).hostname.replace(/^www\.|^m\.|^open\./,'');
  const sp=u.match(/spotify\.com\/(?:intl-\w+\/)?(album|artist|track|show|episode|playlist)/);
  if(sp)return{type:{album:'album',artist:'artist',track:'song'}[sp[1]]||'set',src:'Spotify'};
  if(/youtube\.com|youtu\.be/.test(h))return{type:'set',src:'YouTube'};
  if(/soundcloud/.test(h))return{type:'set',src:'SoundCloud'};
  if(/mixcloud/.test(h))return{type:'set',src:'Mixcloud'};
  if(/twitch/.test(h))return{type:'set',src:'Twitch'};
  if(/bandcamp/.test(h))return{type:'album',src:'Bandcamp'};
  if(/imdb|letterboxd|themoviedb/.test(h))return{type:/\/tv\//.test(u)?'show':'movie',src:h};
  if(/vimeo/.test(h))return{type:'set',src:'Vimeo'};
  if(/steampowered|itch\.io|rawg|nintendo|playstation|xbox|gog\.com|epicgames/.test(h))return{type:'game',src:h};
  return{type:'set',src:h}}
const getJSON=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
async function meta(u){const e=encodeURIComponent(u);const yt=u.match(/(?:v=|youtu\.be\/|shorts\/|live\/)([\w-]{11})/);
  const tries=[];
  if(/spotify/.test(u))tries.push('https://open.spotify.com/oembed?url='+e);
  if(/soundcloud/.test(u))tries.push('https://soundcloud.com/oembed?format=json&url='+e);
  if(/mixcloud/.test(u))tries.push('https://app.mixcloud.com/oembed/?format=json&url='+e);
  if(/vimeo/.test(u))tries.push('https://vimeo.com/api/oembed.json?url='+e);
  if(yt)tries.push('https://www.youtube.com/oembed?format=json&url='+e);
  tries.push('https://noembed.com/embed?url='+e);
  for(const t of tries){try{const j=await getJSON(t);if(j.title){let title=j.title,creator=j.author_name||'';
    const by=title.match(/^(.*) by (.*)$/);if(/soundcloud/.test(u)&&by&&!creator){title=by[1];creator=by[2]}
    return{title,creator,art:j.thumbnail_url||(yt?`https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg`:'')}}}catch(x){}}
  return yt?{art:`https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg`}:null}
function addItem(o,open=true){const it={id:uid(),type:'album',title:'',creator:'',status:'check',by:'',note:'',url:'',art:'',rating:0,added:new Date().toISOString(),extra:{},...o};
  st.items.unshift(it);save();if(st.stat==='done')st.stat='open';render();if(open){openItem(it.id);toast(`Added ${it.title||'link'}`)}else quick(it);
  $('#q').value='';$('#res').classList.remove('on');$('.add').classList.remove('full');$('#q').blur();return it}
async function addUrl(u){const d=fromUrl(u);const it=addItem({type:d.type,title:'Loading '+d.src+' link…',url:u,spotify:/spotify\.com/.test(u)?u:''},false);
  const m=await meta(u);it.title=m?.title||(d.src+' link');if(m?.creator)it.creator=m.creator;if(m?.art)it.art=m.art;
  save();render();if(cur===it)drawItem();if($('#qa').dataset.id===it.id&&$('#qa').classList.contains('on'))quick(it)}

let rs=[],hi=0,timer,seq=0;
function showRes(groups,note){const r=$('#res');rs=[];let html='';
  for(const [h,items] of groups){if(!items.length)continue;html+=h?`<h6>${h}</h6>`:'<hr>';
    for(const x of items){rs.push(x);html+=`<button type="button" data-i="${rs.length-1}" class="${rs.length-1===hi?'hi':''}">${x.it?cover(x.it,'mini'):''}<div><div>${esc(x.label)}</div><small>${esc(x.sub||'')}</small></div></button>`}}
  r.innerHTML=(note?`<div class="note">${note}</div>`:'')+html;r.classList.toggle('on',!!html)}
$('#res').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)pick(rs[+b.dataset.i])});
function pick(x){if(!x)return;if(x.open){openItem(x.open);$('#res').classList.remove('on');$('#q').value=''}else if(x.url)addUrl(x.url);else{const it=addItem(x.add,!x.it);findSpotify(it)}}
async function findSpotify(it){if(!['album','song'].includes(it.type)||it.spotify||!/deezer\.com/.test(it.url))return;
  try{const j=await getJSON('https://api.song.link/v1-alpha.1/links?userCountry=US&url='+encodeURIComponent(it.url));const u=j.linksByPlatform?.spotify?.url;
    if(u){it.spotify=u;save();render();if(cur===it)drawItem()}}catch(e){}}
let online=null,onNote='';
function jsonp(u,ms=7000){return new Promise((res,rej)=>{const cb='cb'+uid(),s=document.createElement('script');let done=false;
  const end=()=>{done=true;delete window[cb];s.remove()};
  window[cb]=d=>{end();res(d)};s.onerror=()=>{end();rej(0)};setTimeout(()=>{if(!done){end();rej(0)}},ms);
  s.src=u+(u.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(s)})}
const yr=d=>(d||'').slice(0,4);
const big=u=>(u||'').replace(/\/\d+x\d+bb\./,'/600x600bb.');
const SRC=[
 ['Artists',q=>jsonp(`https://api.deezer.com/search/artist?q=${q}&limit=3&output=jsonp`).then(j=>(j.data||[]).map(r=>({type:'artist',title:r.name,creator:'',art:r.picture_xl||r.picture_medium,url:r.link,sub:`Artist, ${(r.nb_fan||0).toLocaleString()} fans`,pop:r.nb_fan})))],
 ['Albums',q=>jsonp(`https://api.deezer.com/search/album?q=${q}&limit=4&output=jsonp`).then(j=>(j.data||[]).map(r=>({type:'album',title:r.title,creator:r.artist?.name||'',art:r.cover_xl||r.cover_medium,url:r.link,sub:`${r.record_type==='single'?'Single':r.record_type==='ep'?'EP':'Album'}, ${r.artist?.name||''}`})))],
 ['Songs',q=>jsonp(`https://api.deezer.com/search/track?q=${q}&limit=3&output=jsonp`).then(j=>(j.data||[]).map(r=>({type:'song',title:r.title,creator:r.artist?.name||'',art:r.album?.cover_xl||r.album?.cover_medium,url:r.link,sub:`Song, ${r.artist?.name||''}${r.album?.title?', from '+r.album.title:''}`})))],
 ['Films',q=>jsonp(`https://itunes.apple.com/search?term=${q}&media=movie&entity=movie&limit=4`).then(j=>(j.results||[]).map(r=>({type:'movie',title:r.trackName,creator:r.artistName||'',art:big(r.artworkUrl100),url:r.trackViewUrl,extra:{year:yr(r.releaseDate),mins:r.trackTimeMillis?Math.round(r.trackTimeMillis/6e4):''},sub:`Film${yr(r.releaseDate)?', '+yr(r.releaseDate):''}${r.artistName?', '+r.artistName:''}`})))],
 ['TV',q=>getJSON(`https://api.tvmaze.com/search/shows?q=${q}`).then(j=>(j||[]).slice(0,3).map(({show:r})=>({type:'show',title:r.name,creator:r.network?.name||r.webChannel?.name||'',art:r.image?.original||r.image?.medium||'',url:r.officialSite||r.url,extra:{year:yr(r.premiered)},sub:`TV${yr(r.premiered)?', '+yr(r.premiered):''}${r.network?.name||r.webChannel?.name?', '+(r.network?.name||r.webChannel?.name):''}`})))],
 ['Games',q=>st.rawg?getJSON(`https://api.rawg.io/api/games?key=${encodeURIComponent(st.rawg)}&search=${q}&page_size=4`).then(j=>(j.results||[]).map(r=>{const pl=(r.parent_platforms||r.platforms||[]).map(x=>x.platform.name).slice(0,3).join(', ');return{type:'game',title:r.name,creator:'',art:r.background_image||'',url:`https://rawg.io/games/${r.slug}`,sub:`Game${yr(r.released)?', '+yr(r.released):''}${pl?', '+pl:''}`,extra:{year:yr(r.released),platforms:pl,mins:r.playtime?r.playtime*60:''}}})):Promise.resolve([])],
 ['Live sets and mixes',q=>jsonp(`https://api.mixcloud.com/search/?q=${q}&type=cloudcast&limit=3`).then(j=>(j.data||[]).map(r=>({type:'set',title:r.name,creator:r.user?.name||'',art:r.pictures?.extra_large||r.pictures?.large||'',url:r.url,sub:`Mixcloud, ${r.user?.name||''}${r.audio_length?', '+Math.round(r.audio_length/60)+' min':''}`,extra:{event:'Mixcloud',date:yr(r.created_time),mins:r.audio_length?Math.round(r.audio_length/60):''}})))]];
function localGroups(q){const ql=q.toLowerCase();
  const mine=st.items.filter(i=>(i.title+' '+i.creator).toLowerCase().includes(ql)).slice(0,3).map(i=>({label:i.title,sub:`In your list, ${S[i.status].toLowerCase()}`,open:i.id,it:i}));
  const have=new Set(st.items.map(i=>i.url).filter(Boolean));
  const g=[['In your list',mine]];
  if(online){const all=online.flatMap(([,l])=>l).filter(r=>!have.has(r.url));
    const sc=r=>{const t=r.title.toLowerCase();return(t===ql?4:t.startsWith(ql)?2:t.includes(ql)?1:0)+({artist:.6,show:.5,movie:.4,game:.4,album:.3,song:.1,set:0}[r.type]||0)+Math.min(1,(r.pop||0)/5e6)};
    let top=all.length?all.reduce((a,b)=>sc(b)>sc(a)?b:a):null;if(top&&sc(top)<1)top=null;
    const mk=r=>({label:r.title,sub:r.sub,add:{type:r.type,title:r.title,creator:r.creator,art:r.art||'',url:r.url||'',extra:r.extra||{}},it:{type:r.type,title:r.title,art:r.art}});
    if(top)g.push(['Top result',[mk(top)]]);
    for(const [h,l] of online)g.push([h,l.filter(r=>r!==top&&!have.has(r.url)).map(mk)])}
  g.push(['',[{label:`Add “${q}” by hand`,sub:'Fill in the details yourself',add:{type:'album',title:q}}]]);
  return g}
$('#q').addEventListener('input',e=>{const q=e.target.value.trim();hi=0;online=null;clearTimeout(timer);
  if(!q){$('#res').classList.remove('on');return}
  if(isUrl(q)){const d=fromUrl(q);showRes([['Add link',[{label:`Add ${d.src} link as ${T[d.type].toLowerCase()}`,sub:q,url:q}]]]);return}
  showRes(localGroups(q),q.length>1?'Searching music, film, TV, games and Mixcloud…':'');if(q.length<2)return;
  const my=++seq;timer=setTimeout(()=>search(q,my),400)});
$('#q').addEventListener('keydown',e=>{if(!$('#res').classList.contains('on'))return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+rs.length)%rs.length;document.querySelectorAll('#res [data-i]').forEach((b,i)=>b.classList.toggle('hi',i===hi))}
  if(e.key==='Enter'){e.preventDefault();pick(rs[hi])}});
async function search(q,my){const e=encodeURIComponent(q);
  const got=await Promise.allSettled(SRC.map(([,f])=>f(e)));
  if(my!==seq)return;
  online=SRC.map(([h],i)=>[h,got[i].status==='fulfilled'?got[i].value.filter(r=>r.title):[]]);
  const none=got.every(g=>g.status==='rejected');
  const g0=localGroups(q);hi=online.some(([,l])=>l.length)?g0[0][1].length:0;showRes(g0,none?'Online search isn’t reachable from this page. Open the app file in your browser to search, or add it by hand.':st.rawg?'':'Add a free RAWG key in Library, Settings to search games too.')}

/* library menu */
function dlg(html){const d=$('#dlg');d.innerHTML=html;d.showModal();d.querySelector('[data-close]')?.addEventListener('click',()=>d.close())}
function download(name,text,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(text instanceof Blob?text:new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
function copyBox(title,desc,text,name,type){dlg(`<h3>${title}</h3><p>${desc}</p><textarea id="dt" readonly>${esc(text)}</textarea><div class="dbtn"><button class="btn" data-close>Close</button><button class="btn" id="dl">Download file</button><button class="btn pri" id="cp">Copy</button></div>`);
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(text);$('#cp').textContent='Copied'}catch(e){$('#dt').select()}};
  $('#dl').onclick=()=>download(name,text,type)}
function shareHtml(){const list=st.view==='diary'?posterItems():sorted(st.items.filter(i=>inGrp(i,st.grp)&&inStat(i,st.stat)));const name=G.find(g=>g[0]===st.grp)[1];
  const rows=list.map(it=>`<article><p class="k">${T[it.type]}${it.extra?.event?', '+esc(it.extra.event):''}</p><h2>${(spot(it)||it.url)?`<a href="${esc(spot(it)||it.url)}">${esc(it.title)}</a>`:esc(it.title)}</h2>${it.creator?`<p class="by">${esc(it.creator)}</p>`:''}${it.note?`<blockquote>${esc(it.note)}</blockquote>`:''}</article>`).join('');
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check this out: ${esc(name)}</title><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff;color:#111214;font:16px/1.5 "Inter Tight",sans-serif}main{max-width:720px;margin:0 auto;padding:48px 20px}h1{font-size:40px;letter-spacing:-.02em;line-height:1.05;margin:0 0 8px}main>p{color:#686b73;margin:0 0 24px}article{padding:32px 0;border-top:1px solid #e7e8eb;font-family:Newsreader,Georgia,serif}.k{font:13px "Inter Tight",sans-serif;color:#686b73;margin:0}h2{font-weight:500;font-size:34px;line-height:1.08;letter-spacing:-.02em;margin:8px 0 4px}h2 a{color:inherit;text-decoration-thickness:1px;text-underline-offset:5px}.by{color:#686b73;font-size:18px;margin:0}blockquote{margin:16px 0 0;font-size:19px;font-style:italic}@media(prefers-color-scheme:dark){body{background:#0f1013;color:#ececee}article{border-color:#25272c}}</style></head><body><main><h1>Check this out</h1><p>${list.length} picks: ${esc(name.toLowerCase())}, shared ${new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</p>${rows}</main></body></html>`}
function menu(k){
  if(k==='export')copyBox('Export backup','Everything you have saved, as JSON. Keep it somewhere safe, or import it on another device.',JSON.stringify({items:st.items},null,1),'check-this-out-backup.json','application/json');
  if(k==='share')copyBox('Share this list','A read-only page of the items that match your current filters, with notes but without ratings. Send the file or host it anywhere.',shareHtml(),'check-this-out-list.html','text/html');
  if(k==='import')$('#file').click();
  if(k==='poster')posterDlg();
  if(k==='settings'){dlg(`<h3>Settings</h3><p>Free API keys turn on extra lookups. They stay in this browser. TMDB powers where to watch (themoviedb.org, Settings, API). RAWG powers game search.</p><label for="tk" style="font-size:13px;color:var(--mut)">TMDB API key</label><input id="tk" value="${esc(st.tmdb)}" autocomplete="off"><label for="rg" style="font-size:13px;color:var(--mut);display:block;margin-top:12px">Country</label><input id="rg" value="${esc(st.region)}" maxlength="2" style="width:80px;text-transform:uppercase"><label for="rk" style="font-size:13px;color:var(--mut);display:block;margin-top:12px">RAWG API key, for game search (free at rawg.io/apidocs)</label><input id="rk" value="${esc(st.rawg||'')}" autocomplete="off"><p style="font-size:13px;color:var(--mut);margin-top:16px">Setting up another device? Copy a setup link, send it to yourself, and open it there. It holds your keys, so keep it private.</p><button class="btn" id="tl" type="button">Copy setup link</button><input id="tlo" readonly style="display:none;margin-top:8px"><div class="dbtn"><button class="btn" data-close>Cancel</button><button class="btn pri" id="ts">Save</button></div>`);
    $('#tl').onclick=async()=>{const u=location.origin+location.pathname+'#setup='+encodeURIComponent(JSON.stringify({t:$('#tk').value.trim(),r:($('#rg').value.trim()||'US').toUpperCase(),g:$('#rk').value.trim()}));const o=$('#tlo');o.value=u;o.style.display='block';o.select();try{await navigator.clipboard.writeText(u);toast('Setup link copied')}catch(e){toast('Copy the link shown below')}};
    $('#ts').onclick=()=>{st.tmdb=$('#tk').value.trim();st.region=($('#rg').value.trim()||'US').toUpperCase();st.rawg=$('#rk').value.trim();save();$('#dlg').close();toast('Settings saved');if(cur){loadWatch(cur,true);drawItem()}}}
}
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const inc=(j.items||[]).filter(i=>i.id&&i.title&&T[i.type]);const have=new Set(st.items.map(i=>i.id));
  upd(()=>st.items=[...inc.filter(i=>!have.has(i.id)),...st.items],`Imported ${inc.filter(i=>!have.has(i.id)).length} items`)}catch(x){toast('That file isn’t a backup from this app')}e.target.value=''});

document.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'&&t.parentNode?.classList.contains('cv')){t.parentNode.classList.remove('hasimg');t.remove()}},true);
render();
}
